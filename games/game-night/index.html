<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Game Night 3D</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0620">
<meta name="description" content="A multiplayer 3D game hub: real-physics 3D Ludo with cinematic captures, Snake Arena and Blaster Brawl. Online (peer-to-peer), local and vs bots. Runs in the browser, phone friendly.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='6' y='6' width='52' height='52' rx='12' fill='%235237d6'/%3E%3Ccircle cx='20' cy='20' r='5' fill='%23fff'/%3E%3Ccircle cx='44' cy='44' r='5' fill='%23fff'/%3E%3Ccircle cx='32' cy='32' r='5' fill='%23ffd23f'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/games.css">

<!-- Pinned CDN versions. Three.js and the Rapier physics engine are ES modules; PeerJS is a script. Nothing else is downloaded: no models, images or sounds. -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
    "@dimforge/rapier3d-compat": "https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.14.0/rapier.es.js"
  }
}
</script>
<script>
  // PeerJS 1.5.4 (pinned). Falls back to a second CDN; offline modes still work if both fail.
  window.__peerReady = new Promise(function (resolve) {
    var urls = ['https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js', 'https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js'];
    (function next(i) {
      if (i >= urls.length) return resolve(null);
      var s = document.createElement('script'); s.src = urls[i];
      s.onload = function () { resolve(window.Peer); }; s.onerror = function () { next(i + 1); };
      document.head.appendChild(s);
    })(0);
  });
</script>
</head>
<body>
<div id="app">
  <canvas id="gl" tabindex="-1"></canvas>
  <div id="ui"></div>
  <div id="toasts" aria-live="polite"></div>
  <div id="loading"><div class="dice">6</div><div class="msg" id="loading-msg">LOADING GAME NIGHT…</div></div>
</div>
<noscript><p style="position:fixed;inset:0;display:grid;place-items:center;color:#fff">Game Night 3D needs JavaScript.</p></noscript>
<script type="module" src="js/main.js"></script>
</body>
</html>
